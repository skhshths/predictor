<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tailwind Bay</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
/* Aircraft-placard UI: flat black plates, square corners, condensed caps, one taxiway-yellow accent. */
:root {
  color-scheme: dark;
  --bg: #0b0c0d; --plate: rgba(12, 13, 14, 0.94); --plate-2: #1b1d1f; --line: #44484c; --fg: #e9e9e4; --dim: #8b9094;
  --accent: #ffd400; --accent-ink: #000; --good: #5fd35f; --bad: #ff4b3a;
  --ui: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 15px/1.35 var(--ui); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--plate-2); padding: 8px 12px; text-align: left; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 13px; }
button:hover:not(:disabled) { border-color: var(--fg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
button:active:not(:disabled) { background: var(--fg); color: #000; }
button:disabled { color: var(--dim); cursor: default; background: transparent; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
h1, h2, h3 { font-family: var(--ui); font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .08em; }
kbd { font: 700 12px var(--mono); background: var(--fg); color: #000; padding: 0 5px; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

#top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
#objective { background: var(--plate); border-left: 4px solid var(--accent); padding: 6px 12px; max-width: min(460px, 62vw); text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
#objective b { color: var(--accent); }
#coins { background: var(--plate); padding: 6px 12px; font: 700 15px var(--mono); display: flex; gap: 8px; align-items: baseline; }
#coins i { display: none; }
#coins::before { content: "COINS"; font: 600 11px var(--ui); letter-spacing: .1em; color: var(--dim); }
#prompt { position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%); background: var(--plate); border: 1px solid var(--line); padding: 6px 12px; pointer-events: none; white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
#toasts { position: fixed; z-index: 5; top: 84px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 2px; align-items: center; pointer-events: none; width: min(92vw, 560px); }
.toast { background: var(--plate); border-left: 4px solid var(--fg); padding: 6px 12px; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s; }
#fade.on { opacity: 1; }

/* Title */
#title { position: fixed; left: 0; bottom: 0; background: var(--plate); border-top: 4px solid var(--accent); padding: 22px max(16px, 3vw) 26px; width: min(560px, 100vw); display: grid; gap: 14px; }
#title h1 { font-size: clamp(40px, 7vw, 68px); line-height: .9; letter-spacing: .02em; }
#title .data { font: 600 12px var(--mono); color: var(--dim); letter-spacing: .04em; }
#title .row { display: flex; gap: 6px; flex-wrap: wrap; }
#title button { font-size: 15px; padding: 10px 18px; }
#loading { position: fixed; left: 0; bottom: 0; background: var(--plate); padding: 10px 16px; font: 600 13px var(--mono); text-transform: uppercase; letter-spacing: .1em; }

/* Side panel (shops, hangar) and centred modal (pause, controls) */
#panel { position: fixed; top: 0; bottom: 0; left: 0; width: min(430px, 100vw); background: var(--plate); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#panel header, #modal header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#panel header h2, #modal header h2 { font-size: 20px; }
#panel .body, #modal .body { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
#panel footer, #modal footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
#modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, 96vw); max-height: 92vh; background: var(--plate); border: 1px solid var(--line); border-top: 4px solid var(--accent); display: flex; flex-direction: column; }
#scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); }
.menu { display: grid; gap: 4px; }
.menu button { font-size: 15px; padding: 11px 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stat { background: var(--bg); padding: 5px 8px; min-width: 0; font: 12px var(--mono); color: var(--dim); }
.stat small { display: block; font: 600 10px var(--ui); text-transform: uppercase; letter-spacing: .1em; }
.stat b { font: 700 17px var(--mono); color: var(--fg); }
.card { border: 1px solid var(--line); padding: 9px 10px; display: grid; gap: 6px; }
.card.on { border-color: var(--accent); border-left-width: 4px; }
.card .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .head b { font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
.card p { margin: 0; color: var(--dim); font-size: 13.5px; }
.chips { display: flex; gap: 4px 10px; flex-wrap: wrap; }
.chip { font: 600 11.5px var(--mono); text-transform: uppercase; }
.chip.up { color: var(--good); } .chip.down { color: var(--bad); }
.price { font: 700 13px var(--mono); color: var(--accent); white-space: nowrap; text-transform: uppercase; }
.swatch { display: inline-flex; vertical-align: middle; } .swatch i { width: 18px; height: 12px; display: inline-block; }
.tabs { display: flex; gap: 0; flex-wrap: wrap; border: 1px solid var(--line); }
.tabs button { padding: 5px 9px; font-size: 12px; border: 0; background: transparent; flex: 1 0 auto; text-align: center; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.list { display: grid; gap: 0; border: 1px solid var(--line); }
.list button { display: flex; justify-content: space-between; gap: 8px; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
.list button:last-child { border-bottom: 0; }
.list button.on { background: var(--fg); color: #000; } .list button.on small { color: #000; }
.list small { color: var(--dim); font-family: var(--mono); }
.bar { height: 8px; background: var(--plate-2); } .bar i { display: block; height: 100%; background: var(--fg); }
.barrow { display: grid; grid-template-columns: 92px 1fr 74px; gap: 8px; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; } .barrow span:last-child { font-family: var(--mono); text-align: right; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--plate-2); padding-bottom: 6px; }
.field label { min-width: 0; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; } .field small { display: block; color: var(--dim); text-transform: none; letter-spacing: 0; }
input[type=text] { background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; width: 100%; font-family: var(--mono); text-transform: uppercase; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 170px; height: 20px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line); }
input[type=range]::-moz-range-track { height: 4px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 18px; margin-top: -7px; background: var(--accent); border: 0; border-radius: 0; }
input[type=range]::-moz-range-thumb { width: 8px; height: 18px; background: var(--accent); border: 0; border-radius: 0; }
input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border: 1px solid var(--fg); background: transparent; margin: 0; cursor: pointer; }
input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); }
select { background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; text-transform: uppercase; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--plate-2); text-align: left; vertical-align: middle; }
th { color: var(--dim); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; }
td button { padding: 3px 8px; font-size: 11px; }
.bindtxt { font-family: var(--mono); font-size: 12px; } .bindtxt.off { color: var(--bad); } .bindtxt.none { color: var(--dim); }
.dev { border: 1px solid var(--line); padding: 8px 10px; display: grid; gap: 6px; font-family: var(--mono); font-size: 12px; }
.dev .axes { display: flex; gap: 3px; flex-wrap: wrap; align-items: flex-end; }
.axis { width: 24px; text-align: center; font: 10px var(--mono); color: var(--dim); } .axis div { height: 34px; background: var(--plate-2); position: relative; overflow: hidden; } .axis i { position: absolute; left: 0; right: 0; height: 3px; background: var(--accent); }
.btns { display: flex; gap: 2px; flex-wrap: wrap; } .btns i { width: 11px; height: 11px; background: var(--plate-2); } .btns i.on { background: var(--accent); }
h3 { font-size: 12px; margin-top: 10px; color: var(--dim); letter-spacing: .14em; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; } @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; font-size: 13px; }
.note { margin: 0; color: var(--dim); font-size: 13.5px; }

/* Dialogue */
#dialog { position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); width: min(720px, 96vw); background: var(--plate); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 12px 16px; display: grid; gap: 8px; }
#dialog .who { display: flex; gap: 10px; align-items: baseline; } #dialog .who b { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; } #dialog .who span { color: var(--dim); font: 600 11px var(--mono); text-transform: uppercase; }
#dialog p { margin: 0; font-size: 16px; max-width: 70ch; }
#dialog .opts { display: flex; gap: 6px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="top" hidden><div id="objective" hidden></div><span></span><div id="coins"><i></i><span class="num">0</span></div></div>
<div id="prompt" hidden></div>
<div id="toasts"></div>
<div id="fade"></div>
<div id="scrim" hidden></div>
<div id="panel" hidden></div>
<div id="modal" hidden></div>
<div id="dialog" hidden></div>
<div id="title" hidden>
  <h1>Tailwind Bay</h1>
  <div class="data">RWY 18/36 · 3000 M · ELEV 190 FT · 33 AIRCRAFT · 9 AIRFIELDS</div>
  <div class="row"><button class="primary" id="btn-start">Start</button><button id="btn-controls">Controls</button><button id="btn-help">Help</button></div>
</div>
<div id="loading">Loading</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
