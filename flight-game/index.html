<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tailwind Bay</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
/* Layout: full-screen 3D view; a brass-and-navy instrument look for every overlay. */
:root {
  color-scheme: dark;
  --ink: #0d1626; --panel: rgba(13, 22, 38, 0.93); --panel-2: rgba(28, 42, 66, 0.92); --line: rgba(233, 215, 170, 0.22);
  --cream: #f4ead2; --muted: #a9b4c6; --brass: #e9b949; --brass-ink: #2a1d05; --good: #7fd6a1; --bad: #ff8a7a; --sky: #8fd0ff;
  --display: "Georgia", "Iowan Old Style", "Times New Roman", serif;
  --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "SF Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--cream); font: 15px/1.45 var(--body); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 14px; text-align: left; transition: background .12s, border-color .12s, transform .08s; }
button:hover:not(:disabled) { border-color: var(--brass); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
button.ghost { background: transparent; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
kbd { font: 600 12px var(--mono); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

#top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
#objective { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-width: min(420px, 60vw); }
#objective b { color: var(--brass); }
#coins { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
#coins i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--brass) 55%, #a8791a); display: inline-block; }
#prompt { position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; pointer-events: none; white-space: nowrap; }
#toasts { position: fixed; z-index: 5; top: 70px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 560px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 8px; padding: 9px 14px; animation: drop .25s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
#fade { position: fixed; inset: 0; background: #05080f; opacity: 0; pointer-events: none; transition: opacity .5s; }
#fade.on { opacity: 1; }

/* Title */
#title { position: fixed; inset: 0; display: grid; align-content: end; justify-items: start; padding: 0 max(16px, 6vw) 9vh; background: linear-gradient(180deg, rgba(13,22,38,0) 30%, rgba(13,22,38,.82)); }
#title h1 { font-size: clamp(44px, 9vw, 104px); line-height: .95; font-style: italic; text-shadow: 0 3px 24px rgba(0,0,0,.45); }
#title p { max-width: 54ch; color: var(--cream); margin: 14px 0 20px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
#title .row { display: flex; gap: 10px; flex-wrap: wrap; }
#title button { font-size: 17px; padding: 12px 22px; }
#loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: italic 22px var(--display); }

/* Side panel (shops, hangar) and centred modal (pause, controls) */
#panel { position: fixed; top: 0; bottom: 0; left: 0; width: min(430px, 100vw); background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#panel header, #modal header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#panel header h2, #modal header h2 { font-size: 24px; font-style: italic; }
#panel .body, #modal .body { overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
#panel footer, #modal footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
#modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, 94vw); max-height: 90vh; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
#scrim { position: fixed; inset: 0; background: rgba(5, 8, 15, .5); }
.menu { display: grid; gap: 8px; }
.menu button { font-size: 16px; padding: 12px 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: rgba(255,255,255,.05); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.stat b { font: 700 16px var(--mono); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: rgba(255,255,255,.03); }
.card.on { border-color: var(--brass); background: rgba(233,185,73,.08); }
.card .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .head b { font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font: 600 11.5px var(--mono); padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.07); }
.chip.up { color: var(--good); } .chip.down { color: var(--bad); }
.price { font: 700 14px var(--mono); color: var(--brass); white-space: nowrap; }
.swatch { display: inline-flex; gap: 3px; vertical-align: middle; } .swatch i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); display: inline-block; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 5px 10px; border-radius: 999px; font-size: 13px; }
.tabs button.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
.list { display: grid; gap: 6px; }
.list button { display: flex; justify-content: space-between; gap: 8px; }
.list button.on { border-color: var(--brass); background: rgba(233,185,73,.12); }
.list small { color: var(--muted); font-family: var(--mono); }
.bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--sky); }
.barrow { display: grid; grid-template-columns: 92px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; } .barrow span:last-child { font-family: var(--mono); text-align: right; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.field label { min-width: 0; } .field small { display: block; color: var(--muted); }
input[type=text] { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
input[type=range] { width: 160px; accent-color: var(--brass); } input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--brass); }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.07); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
td button { padding: 4px 10px; font-size: 12.5px; }
.bindtxt { font-family: var(--mono); font-size: 12px; } .bindtxt.off { color: var(--bad); } .bindtxt.none { color: var(--muted); }
.dev { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; }
.dev .axes { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; }
.axis { width: 26px; text-align: center; font: 10px var(--mono); color: var(--muted); } .axis div { height: 34px; background: rgba(255,255,255,.08); border-radius: 3px; position: relative; overflow: hidden; } .axis i { position: absolute; left: 0; right: 0; height: 3px; background: var(--brass); }
.btns { display: flex; gap: 3px; flex-wrap: wrap; } .btns i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.12); } .btns i.on { background: var(--brass); }
h3 { font-size: 15px; margin-top: 8px; color: var(--brass); font-style: italic; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; } @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; font-size: 13.5px; }

/* Dialogue */
#dialog { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(720px, 94vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
#dialog .who { display: flex; gap: 10px; align-items: baseline; } #dialog .who b { font: italic 700 21px var(--display); color: var(--brass); } #dialog .who span { color: var(--muted); font-size: 13px; }
#dialog p { margin: 0; font-size: 16.5px; max-width: 68ch; }
#dialog .opts { display: flex; gap: 8px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="top" hidden><div id="objective" hidden></div><span></span><div id="coins"><i></i><span class="num">0</span></div></div>
<div id="prompt" hidden></div>
<div id="toasts"></div>
<div id="fade"></div>
<div id="scrim" hidden></div>
<div id="panel" hidden></div>
<div id="modal" hidden></div>
<div id="dialog" hidden></div>
<div id="title" hidden>
  <h1>Tailwind Bay</h1>
  <p>A flying town with a hangar full of aeroplanes, eight airstrips to find, and one odd little machine that is yours to build up part by part.</p>
  <div class="row"><button class="primary" id="btn-start">Start flying</button><button id="btn-controls">Controls &amp; joystick setup</button><button id="btn-help">How to play</button></div>
</div>
<div id="loading">Rolling the aeroplanes out…</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
